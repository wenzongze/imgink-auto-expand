[ACCOUNT]
account  = 你的img.ink账号
password = 你的密码

[MAIL]
smtp_server = smtp.qq.com
smtp_port   = 465
sender      = 你的QQ邮箱@qq.com
auth_code   = 邮箱授权码（非登录密码）
receiver    = 接收通知的邮箱@qq.com

[SETTING]
random_start = 8      # 允许执行的最早小时（8 点）
random_end   = 22     # 允许执行的最晚小时（22 点）
login_url  = https://img.ink/auth/login.html
expand_url = https://img.ink/user/moremore.html
